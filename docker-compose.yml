version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bangbet-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-bangbet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-BangBet_DB_2026!}
      POSTGRES_DB: ${DB_NAME:-bangbet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - bangbet-network

  api:
    build: 
      context: ./server
    container_name: bangbet-api
    restart: always
    depends_on:
      - db
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - CORS_ORIGIN=*
    ports:
      - "3001:3001"
    networks:
      - bangbet-network

networks:
  bangbet-network:
    driver: bridge

volumes:
  postgres_data:
